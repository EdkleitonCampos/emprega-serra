<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="description" content="Emprega Serra: plataforma regional para conectar talentos, empresas, serviços e qualificação em Serra Talhada e no Sertão pernambucano.">
    <meta name="theme-color" content="#183f2b">
    <title>{% block title %}Emprega Serra | Seu talento merece uma oportunidade{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sertao.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/acabamento.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/homepage-sertao-final.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/paginas-internas.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cabecalho.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
